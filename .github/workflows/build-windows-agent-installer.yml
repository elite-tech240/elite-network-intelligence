name: Build Windows Agent Installer

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'frontend/**'
      - '.github/workflows/build-windows-agent-installer.yml'
  pull_request:
    paths:
      - 'agent/**'
      - 'frontend/**'
      - '.github/workflows/build-windows-agent-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform-smoke:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install agent dependencies
        run: python -m pip install -r agent/requirements.txt
      - name: Run collector tests
        env:
          PYTHONPATH: agent
        run: python -m unittest discover -s agent/tests -v
      - name: Compile agent modules
        run: python -m compileall -q agent

  macos-smoke:
    name: Core tests (macos-latest, informational)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install agent dependencies
        run: python -m pip install -r agent/requirements.txt
      - name: Run collector tests
        env:
          PYTHONPATH: agent
        run: python -m unittest discover -s agent/tests -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build dashboard
        working-directory: frontend
        run: npm run build

  build-windows-installer:
    needs: [cross-platform-smoke, frontend-build]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install agent dependencies and packager
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt pyinstaller==6.11.1
      - name: Build standalone agent executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name EliteNetworkAgent --icon agent/installer/elite-network-icon.ico agent/agent.py
          New-Item -ItemType Directory -Force agent/build | Out-Null
          Copy-Item dist/EliteNetworkAgent.exe agent/build/EliteNetworkAgent.exe
      - name: Download WinSW service wrapper
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe -OutFile agent/build/EliteNetworkAgentService.exe
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" agent/installer/EliteNetworkAgent.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: EliteNetworkAgent-Windows-Installer
          path: agent/dist/EliteNetworkAgent-Setup.exe
          if-no-files-found: error

  publish-windows-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-windows-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: EliteNetworkAgent-Windows-Installer
          path: release-assets
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Read the agent version
        id: agent
        run: |
          version=$(grep -oP '^AGENT_VERSION\s*=\s*"\K[^"]+' agent/agent.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Stage the Unix installer alongside it
        run: cp agent/install.sh release-assets/install.sh
      - name: Publish installer release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-installer-v${{ steps.agent.outputs.version }}
          name: Elite Network Agent Installer v${{ steps.agent.outputs.version }}
          body: |
            Branded Windows x64 single-file installer, plus install.sh for Linux and macOS.
            Enter a unique one-time enrollment token and site ID in the setup wizard for each computer.

            Agents from v0.5.0 can be updated from the web app; older ones need this installer run once by hand.
          files: |
            release-assets/EliteNetworkAgent-Setup.exe
            release-assets/install.sh
          overwrite_files: true
          make_latest: true
          fail_on_unmatched_files: true
